# Teaching configuration. Model/engine files are supplied by the learner.
# Relative model paths are resolved from THIS YAML directory, not cwd.
schema_version: 1
model:
  onnx: ../models/detector.onnx
  engine: ../cache/detector-trt10.10-fp32.engine
  input_name: images
  output_name: output0
  input_shape: [1, 3, 640, 640]
runtime:
  backend: tensorrt             # opencv_cpu | opencv_cuda | tensorrt
  cuda_enabled: true           # permission for GPU features; NOT a backend switch
  device_id: 0
  precision: fp32              # fp32 | fp16 (fp16 supported here only for TensorRT)
  mode: sync                   # sync | async | parallel (last two: TensorRT only here)
  slots: 1                     # sync/async: 1; parallel: 2..8, teaching limit
preprocess:
  implementation: fused_cuda   # cpu | opencv_cuda | fused_cuda
  pad_value: 124               # model-specific, not a universal letterbox value
postprocess:
  implementation: cuda_decode  # cpu | cuda_decode
  output_layout: candidate_major # candidate_major: [1,K,4+C]; feature_major: [1,4+C,K]
  num_classes: 2               # replace with the actual model's class count
  score_threshold: 0.5
  nms_iou: 0.5
benchmark:
  warmup: 30
  frames: 300
